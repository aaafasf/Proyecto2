name: Despliegue Python

on:
  push:
    branches: ["final"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: aaafasf
        password: ${{ secrets.GHCR_PAT }}

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          ghcr.io/aaafasf/steven1:3.0.0
          ghcr.io/aaafasf/steven1:latest

    - name: Test SSH connection
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: echo "SSH OK"

    - name: Copy stack.yml
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/deploy1"

    - name: Deploy stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          cd ~/deploy1
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u aaafasf --password-stdin
          docker pull ghcr.io/aaafasf/steven1:3.0.0
          docker stack rm steven || true
          sleep 10
          docker stack deploy --with-registry-auth -c stack.yml steven
          docker service ls